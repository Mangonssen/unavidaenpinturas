<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Una vida en pinturas</title>

</head>

<body>
    <div class="book-container">
        <div class="book" id="book">

            <section class="page single" id="cover"></section>

            <section class="page left bg-black noise"></section>
            <section class="page right bg-black noise"></section>

            <section class="page left bg-black noise"></section>
            <section class="page right" id="innertitle"></section>
            <section class="page left" id="imprint"></section>
            <section class="page right" id="innertitle-2"></section>
            <section class="page left" id="p4"></section>
            <section class="page right" id="p5"></section>
            <section class="page left" id="p6"></section>
            <section class="page right" id="p7"></section>
            <section class="page left" id="p8"></section>
            <section class="page right" id="p9"></section>
            <section class="page left" id="p10"></section>
            <section class="page right" id="p11"></section>
            <section class="page left" id="p12"></section>
            <section class="page right" id="p13"></section>
            <section class="page left" id="p14"></section>
            <section class="page right" id="p15"></section>
            <section class="page left" id="p16"></section>
            <section class="page right" id="p17"></section>
            <section class="page left" id="p18"></section>
            <section class="page right" id="p19"></section>
            <section class="page left" id="p20">
                <img src="./assets/posters/painting.png" class="draggable" id="img1">
                <img src="./assets/posters/rock.jpg" class="draggable" id="img2">
                <img src="./assets/posters/woman.jpg" class="draggable" id="img3">
            </section>
            <section class="page right" id="p21">
                <img src="./assets/posters/napkin.png" class="draggable" id="img4">
                <img src="./assets/posters/tutorial.png" class="draggable" id="img5">
            </section>
            <section class="page left" id="p22"></section>
            <section class="page right" id="p23"></section>
            <section class="page left" id="p24">
            </section>
            <section class="page right" id="p25">
            </section>
            <section class="page single" id="back"></section>

        </div>
    </div>

    <!-- NAVIGATION -->

    <div class="controls">
        <button id="prev">
            < Previous</button>
                <button id="next">Next ></button>
    </div>


    <script>
        const book = document.getElementById("book");
        const pages = Array.from(book.children);

        const prev = document.getElementById("prev");
        const next = document.getElementById("next");

        let current = 0;

        // ======================================
        // AUDIO CLIPS
        // ======================================

        const pulseAudio = new Audio("./assets/sound/pulse.mp3");
        pulseAudio.volume = 0.75;

        const staticAudio = new Audio("./assets/sound/static.mp3");
        staticAudio.volume = 0.05;
        staticAudio.loop = true;
        staticAudio.play().catch(() => { });

        const clockAudio = new Audio("./assets/sound/clock.mp3");

        const fireAudio = new Audio("./assets/sound/fire.mp3");
        fireAudio.volume = 0.25;

        const nyAudio = new Audio("./assets/sound/ny.mp3");
        nyAudio.volume = 0.15;

        const waterAudio = new Audio("./assets/sound/water.mp3");
        waterAudio.volume = 0.25;

        const restaurantAudio = new Audio("./assets/sound/restaurant.mp3");
        restaurantAudio.volume = 0.15;

        const heartAudio = new Audio("./assets/sound/heart.mp3");
        heartAudio.volume = 0.25;

        const stepsAudio = new Audio("./assets/sound/steps.mp3");
        stepsAudio.volume = 0.5;


        // ======================================
        // DRAGGABLE IMAGES
        // ======================================

        const draggableImages = [
            "img1",
            "img2",
            "img3",
            "img4",
            "img5"
        ];

        let draggedImage = null;

        let offsetX = 0;
        let offsetY = 0;

        let currentRotation = 0;
        let startX = 0;


        // ======================================
        // INDEXEDDB STORAGE
        // ======================================

        let imageDB;

        // Keep uploaded images available when pages are cloned

        const savedImages = {};
        const imageURLs = {};

        const dbRequest = indexedDB.open("MyBookImages", 1);

        dbRequest.onupgradeneeded = (e) => {

            imageDB = e.target.result;

            if (!imageDB.objectStoreNames.contains("images")) {
                imageDB.createObjectStore("images");
            }

        };

        dbRequest.onsuccess = (e) => {

            imageDB = e.target.result;

            restoreImages();

        };

        dbRequest.onerror = () => {

            console.error("Could not open image database.");

        };


        // ======================================
        // PREVENT BROWSER DEFAULT FILE DROP
        // ======================================

        window.addEventListener("dragover", (e) => {

            if (e.dataTransfer.types.includes("Files")) {
                e.preventDefault();
            }

        });

        window.addEventListener("drop", (e) => {

            if (e.dataTransfer.types.includes("Files")) {
                e.preventDefault();
            }

        });


        // ======================================
        // INITIALIZE DRAGGABLE IMAGES
        // ======================================

        function initializeDraggableImages() {

            draggableImages.forEach(id => {

                const img = document.getElementById(id);

                if (!img || img.dataset.dragInitialized) return;

                img.dataset.dragInitialized = "true";

                // Prevent native image dragging

                img.draggable = false;

                img.addEventListener("pointerdown", startDrag);

            });

        }


        // ======================================
        // START DRAGGING
        // ======================================

        function startDrag(e) {

            draggedImage = e.currentTarget;

            e.preventDefault();

            draggedImage.setPointerCapture(e.pointerId);

            const rect = draggedImage.getBoundingClientRect();

            const parentRect =
                draggedImage.parentElement.getBoundingClientRect();

            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            startX = e.clientX;

            // Get current rotation

            const transform =
                window.getComputedStyle(draggedImage).transform;

            if (transform !== "none") {

                const matrix = new DOMMatrix(transform);

                currentRotation =
                    Math.atan2(matrix.b, matrix.a) * (180 / Math.PI);

            } else {

                currentRotation = 0;

            }

            // Convert position to page-relative coordinates

            draggedImage.style.left =
                (rect.left - parentRect.left) + "px";

            draggedImage.style.top =
                (rect.top - parentRect.top) + "px";

            draggedImage.classList.add("dragging");

            draggedImage.style.transform =
                `rotate(${currentRotation}deg) scale(1.08)`;

            draggedImage.addEventListener("pointermove", dragImage);
            draggedImage.addEventListener("pointerup", stopDrag);
            draggedImage.addEventListener("pointercancel", stopDrag);

        }


        // ======================================
        // DRAG IMAGE
        // ======================================

        function dragImage(e) {

            if (!draggedImage) return;

            const parentRect =
                draggedImage.parentElement.getBoundingClientRect();

            const imageWidth = draggedImage.offsetWidth;
            const imageHeight = draggedImage.offsetHeight;

            let x = e.clientX - parentRect.left - offsetX;
            let y = e.clientY - parentRect.top - offsetY;

            // Keep image inside its page

            x = Math.max(
                0,
                Math.min(x, parentRect.width - imageWidth)
            );

            y = Math.max(
                0,
                Math.min(y, parentRect.height - imageHeight)
            );

            draggedImage.style.left = x + "px";
            draggedImage.style.top = y + "px";

            // Tilting animation

            const movement = e.clientX - startX;

            const tilt = Math.max(
                -15,
                Math.min(15, movement * 0.3)
            );

            draggedImage.style.transform =
                `rotate(${currentRotation + tilt}deg) scale(1.08)`;

        }


        // ======================================
        // STOP DRAGGING
        // ======================================

        function stopDrag(e) {

            if (!draggedImage) return;

            const img = draggedImage;

            img.classList.remove("dragging");

            img.style.transform =
                `rotate(${currentRotation}deg) scale(1)`;

            img.removeEventListener("pointermove", dragImage);
            img.removeEventListener("pointerup", stopDrag);
            img.removeEventListener("pointercancel", stopDrag);

            draggedImage = null;

        }


        // ======================================
        // DIRECT IMAGE DROP
        // ======================================

        function enableFileDrop() {

            document.querySelectorAll(".draggable").forEach(img => {

                if (img.dataset.dropInitialized) return;

                img.dataset.dropInitialized = "true";

                img.addEventListener("dragenter", (e) => {

                    if (!e.dataTransfer.types.includes("Files")) return;

                    e.preventDefault();

                    img.classList.add("drag-over");

                });

                img.addEventListener("dragover", (e) => {

                    if (!e.dataTransfer.types.includes("Files")) return;

                    e.preventDefault();

                    e.stopPropagation();

                    e.dataTransfer.dropEffect = "copy";

                    img.classList.add("drag-over");

                });

                img.addEventListener("dragleave", (e) => {

                    img.classList.remove("drag-over");

                });

                img.addEventListener("drop", (e) => {

                    e.preventDefault();
                    e.stopPropagation();

                    img.classList.remove("drag-over");

                    const file = e.dataTransfer.files[0];

                    if (!file || !file.type.startsWith("image/")) return;

                    if (file.size > 10 * 1024 * 1024) {

                        alert("Image must be smaller than 10 MB.");

                        return;

                    }

                    if (!imageDB) {

                        console.error("Image database is not ready.");

                        return;

                    }

                    // Save image in IndexedDB

                    const transaction = imageDB.transaction(
                        "images",
                        "readwrite"
                    );

                    transaction.objectStore("images").put(file, img.id);

                    transaction.oncomplete = () => {

                        // Keep image available for future page renders

                        savedImages[img.id] = file;

                        // Replace previous object URL

                        if (imageURLs[img.id]) {

                            URL.revokeObjectURL(imageURLs[img.id]);

                        }

                        // Create new image URL

                        const imageURL = URL.createObjectURL(file);

                        imageURLs[img.id] = imageURL;

                        // Replace existing image immediately

                        img.src = imageURL;

                    };

                    transaction.onerror = () => {

                        console.error("Could not save uploaded image.");

                    };

                });

            });

        }


        // ======================================
        // RESTORE SAVED IMAGES
        // ======================================

        function restoreImages() {

            draggableImages.forEach(id => {

                const transaction = imageDB.transaction(
                    "images",
                    "readonly"
                );

                const request =
                    transaction.objectStore("images").get(id);

                request.onsuccess = () => {

                    if (!request.result) return;

                    savedImages[id] = request.result;

                    const img = document.getElementById(id);

                    if (img) {

                        if (imageURLs[id]) {

                            URL.revokeObjectURL(imageURLs[id]);

                        }

                        imageURLs[id] =
                            URL.createObjectURL(request.result);

                        img.src = imageURLs[id];

                    }

                };

            });

        }


        // ======================================
        // APPLY SAVED IMAGES TO CLONED PAGES
        // ======================================

        function applySavedImages() {

            draggableImages.forEach(id => {

                const img = document.getElementById(id);

                if (!img || !savedImages[id]) return;

                if (!imageURLs[id]) {

                    imageURLs[id] =
                        URL.createObjectURL(savedImages[id]);

                }

                img.src = imageURLs[id];

            });

        }


        // ======================================
        // RENDER BOOK
        // ======================================

        function renderBook() {

            book.classList.add("turning");

            setTimeout(() => {

                book.innerHTML = "";

                // COVER

                if (current === 0) {

                    book.appendChild(pages[0].cloneNode(true));

                }

                // BACK COVER

                else if (current === pages.length - 1) {

                    book.appendChild(
                        pages[pages.length - 1].cloneNode(true)
                    );

                }

                // DOUBLE PAGE SPREADS

                else {

                    book.appendChild(
                        pages[current].cloneNode(true)
                    );

                    book.appendChild(
                        pages[current + 1].cloneNode(true)
                    );

                }

                // Apply uploaded images to cloned pages

                applySavedImages();

                // Initialize interactions on cloned pages

                initializeDraggableImages();

                enableFileDrop();

                prev.disabled = current === 0;
                next.disabled = current === pages.length - 1;

                book.classList.remove("turning");

            }, 150);


            // PULSE AUDIO

            if (current === 7) {

                pulseAudio.play();
                pulseAudio.loop = true;

            } else {

                pulseAudio.loop = false;
                pulseAudio.pause();
                pulseAudio.currentTime = 0;

            }


            // CLOCK AUDIO

            if (current === 9) {

                clockAudio.play();

            } else {

                clockAudio.pause();
                clockAudio.currentTime = 0;

            }


            // FIRE AUDIO

            if (current === 11) {

                fireAudio.play();

            } else {

                fireAudio.pause();
                fireAudio.currentTime = 0;

            }


            // NEW YORK AUDIO

            if (current === 13) {

                nyAudio.play();

            } else {

                nyAudio.pause();
                nyAudio.currentTime = 0;

            }


            // WATER AUDIO

            if (current === 15) {

                waterAudio.play();
                waterAudio.loop = true;

            } else {

                waterAudio.loop = false;
                waterAudio.pause();
                waterAudio.currentTime = 0;

            }


            // RESTAURANT AUDIO

            if (current === 17) {

                restaurantAudio.play();

            } else {

                restaurantAudio.pause();
                restaurantAudio.currentTime = 0;

            }


            // HEART AUDIO

            if (current === 19) {

                heartAudio.play();
                heartAudio.loop = true;

            } else {

                heartAudio.pause();
                heartAudio.loop = false;
                heartAudio.currentTime = 0;

            }


            // FOOTSTEPS AUDIO

            if (current === 21) {

                stepsAudio.play();

            } else {

                stepsAudio.pause();
                stepsAudio.currentTime = 0;

            }

        }


        // ======================================
        // NEXT BUTTON
        // ======================================

        next.addEventListener("click", () => {

            if (current < pages.length - 1) {

                if (current === 0) {

                    current = 1;

                }

                else if (current === pages.length - 3) {

                    current = pages.length - 1;

                }

                else {

                    current += 2;

                }

                renderBook();

                const audio = new Audio("./assets/sound/turnpage.mp3");
                audio.play();

                console.log(current);

            }

        });


        // ======================================
        // PREVIOUS BUTTON
        // ======================================

        prev.addEventListener("click", () => {

            if (current > 0) {

                if (current === pages.length - 1) {

                    current = pages.length - 3;

                }

                else if (current === 1) {

                    current = 0;

                }

                else {

                    current -= 2;

                }

                renderBook();

                const audio = new Audio("./assets/sound/turnpage.mp3");
                audio.play();

                console.log(current);

            }

        });


        // ======================================
        // KEYBOARD NAVIGATION
        // ======================================

        document.addEventListener("keydown", (e) => {

            if (e.key === "ArrowRight") {

                next.click();

            }

            if (e.key === "ArrowLeft") {

                prev.click();

            }

        });


        // ======================================
        // INITIALIZE
        // ======================================

        renderBook();

    </script>


</body>

</html>
